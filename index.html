<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API JustMC Creative</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Фоновый логотип -->
  <div class="bg-logo" aria-hidden="true">
    <svg viewBox="0 0 150.44 111.72" xmlns="http://www.w3.org/2000/svg">
      <circle cx="75.25" cy="55.86" r="55.86" fill="#3a6bf2"></circle>
      <path fill="#fff" d="m37.63 66.45 8-4.6c1.27 2.25 2.6 3.45 5.7 3.45 4 0 5.24-2.3 5.24-4.77V33.17h9.2v27.35c0 8.86-6.2 13.76-14.5 13.76-6.4 0-11-2.7-13.65-7.83zm75.07 7.02h-9.2V50L93.08 67.14H92L81.62 50v23.47h-9.2v-40.3h9.2l10.94 17.9 10.94-17.9h9.2z"></path>
    </svg>
  </div>

  <!-- Новая зафиксированная шапка -->
  <header class="top-navbar">
    <div class="nav-left">
      <a href="#" class="brand" id="home-link">
        <span class="brand-dot"></span>
        <span class="brand-text">JustMC API</span>
      </a>
      <div id="api-status" class="status-dot checking" title="Проверка API..."></div>
    </div>
    
    <div class="nav-center">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" placeholder="Поиск по API... (Нажмите /)" autocomplete="off">
        <span class="hotkey-hint">/</span>
      </div>
    </div>
    
    <div class="nav-right">
      <div class="filters">
        <button class="filter-btn active" data-filter="ALL">Все</button>
        <button class="filter-btn" data-filter="GET">GET</button>
        <button class="filter-btn" data-filter="INFO">INFO</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav id="side-nav"></nav>
    </aside>

    <div class="content-wrap">
      <main id="content"></main>
      <footer>
        <p>Неофициальная документация.</p>
      </footer>
    </div>
  </div>

  <button id="back-to-top" title="Наверх">↑</button>
  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
